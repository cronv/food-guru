security:
    # Пароли в bcrypt ($2y$), «auto» их проверяет и при входе может перехешировать.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity: { class: App\Entity\User, property: id }

    # Уровни ролей: старшая роль включает младшие.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_EDITOR_LEAD]
        ROLE_EDITOR_LEAD: [ROLE_CONTENT_MANAGER]
        ROLE_CONTENT_MANAGER: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api/
            stateless: false
            provider: app_users
            user_checker: App\Security\ActiveUserChecker
            custom_authenticators:
                - App\Security\SessionAuthenticator
            entry_point: App\Security\SessionAuthenticator

    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
