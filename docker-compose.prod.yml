# Боевая сборка: API, SSR публичного сайта, админка и обвязка.
# Отличия от docker-compose.yml: нет Mailhog (письма идут через реальный SMTP),
# код внутри образов. Очередь и планировщик не нужны: письма уходят сразу,
# очистку токенов запускает cron командой food-guru:prune-email-tokens (deploy.sh).
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/api.prod.conf:/etc/nginx/conf.d/api.conf:ro
      - ./docker/nginx/symfony-routes.conf:/etc/nginx/symfony-routes.conf:ro
      - ./docker/nginx/symfony-fastcgi.conf:/etc/nginx/symfony-fastcgi.conf:ro
      - ./docker/nginx/site.prod.conf:/etc/nginx/conf.d/site.conf:ro
      - site-build:/var/www/site:ro
      - admin-build:/var/www/admin:ro
      # Загруженные файлы: nginx только читает, пишет PHP-приложение.
      - ./storage:/var/www/storage:ro
    depends_on:
      - api
      - ssr

  # Бэкенд на Symfony 7.4 (api/). Единственный API.
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.prod
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      SSR_API_KEY: ${SSR_API_KEY:?задайте SSR_API_KEY в .env рядом с compose}
    volumes:
      # Каталог на диске сервера: там же лежат загрузки для бэкапа (см. DEPLOY-REGRU.md).
      - ./storage:/var/www/storage
      # Демо-данные для food-guru:seed-demo (запускается вручную, см. deploy.sh): только чтение.
      - ./seed-assets:/var/www/seed-assets:ro
    depends_on:
      mysql:
        condition: service_healthy

  # SSR публичного сайта: рендерит HTML с OG-разметкой для Telegram и поиска.
  ssr:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      SSR_API_KEY: ${SSR_API_KEY:?задайте SSR_API_KEY в .env рядом с compose}
    volumes:
      - site-build:/export/site
      - admin-build:/export/admin
    # Статику Angular копируем в тома, откуда её отдаёт nginx.
    command: >
      sh -c "cp -r /app/dist/site/browser/. /export/site/ &&
             cp -r /app/dist/admin/browser/. /export/admin/ &&
             node dist/site/server/server.mjs"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-food_guru}
      MYSQL_USER: ${DB_USERNAME:-food_guru}
      MYSQL_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD в .env рядом с compose}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?задайте DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    # Наружу порт не открыт: в базу ходят только контейнеры.

volumes:
  mysql-data:
  site-build:
  admin-build:
