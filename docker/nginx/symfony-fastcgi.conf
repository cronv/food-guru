# Передача запроса в Symfony (контейнер api, код в /var/www/api).
# Подключается из location'ов в symfony-routes.conf.
fastcgi_pass api:9000;
include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/api/public;
