# Публичная витрина: ВАШ-ДОМЕН
# Работает в паре с SSR: статику отдаёт nginx, HTML рендерит Node.

upstream ssr {
    server ssr:4000;
}

server {
    listen 80;
    server_name food-guru.ru www.food-guru.ru;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Заголовки безопасности. ВАЖНО: add_header во вложенном location
    # отменяет унаследованные от server, поэтому ниже они повторены в каждом
    # блоке, где есть свой add_header. Это не копипаста, а требование nginx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Политика содержимого включена в режиме отчёта: включать её сразу
    # на запрет без проверки живого сайта нельзя — Angular добавляет стили
    # компонентов инлайном, и строгий style-src сломает вёрстку.
    # Убедитесь по отчётам, что нарушений нет, и переименуйте заголовок
    # в Content-Security-Policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://api.food-guru.ru; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Собранные файлы Angular: имена с хешем, поэтому кэшируем надолго.
    location ~* \.(js|css|woff2)$ {
        root /var/www/site;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri @ssr;
    }

    # Картинки и видео.
    location ~* \.(mp4|jpg|jpeg|png|webp|svg|ico)$ {
        root /var/www/site;
        expires 30d;
        add_header Cache-Control "public";
        # Перемотка рилсов без полной загрузки файла.
        add_header Accept-Ranges bytes;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri @ssr;
    }

    location = /robots.txt {
        root /var/www/site;
    }

    # Манифест отдаём сами: через SSR он доедет, но лишним прыжком в Node,
    # а установка на домашний экран должна работать и когда Node прилёг.
    location = /manifest.webmanifest {
        root /var/www/site;
        default_type application/manifest+json;
        expires 1d;
    }

    # Всё остальное рендерит SSR — ради поисковой выдачи и превью ссылок.
    location / {
        proxy_pass http://ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @ssr {
        proxy_pass http://ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Админка: admin.ВАШ-ДОМЕН — обычное SPA, без SSR.
server {
    listen 80;
    server_name admin.food-guru.ru;
    root /var/www/admin;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    # Админку в поиске видеть незачем.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Маршруты Angular: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
