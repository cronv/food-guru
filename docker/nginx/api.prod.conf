# API: api.ВАШ-ДОМЕН
# TLS вешается снаружи (certbot на хосте или reverse proxy) — здесь только HTTP.

server {
    listen 80;
    server_name api.food-guru.ru;
    root /var/www/html/public;
    index index.php;

    # Загрузка: фото в отзывы и медиатеку — до 8 МБ, видеоработа на конкурс — до 100 МБ.
    # Запас сверх 100 МБ нужен на границы multipart, иначе запрос отвалится по 413.
    client_max_body_size 110m;
    # Крупный файл грузится дольше: с дефолтными 60 с видео не доезжает.
    client_body_timeout 300s;

    # Логи просим писать в stdout контейнера.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Загруженные изображения отдаёт nginx, не PHP.
    # ^~ обязателен: без него регулярное location ~ \.php$ выигрывает
    # у префиксного, и загруженный файл с расширением .php уедет в PHP-FPM.
    # Вложенное правило — вторая страховка на тот же случай.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Повтор обязателен: свой add_header отменяет унаследованные.
        add_header X-Content-Type-Options "nosniff" always;
        # Загруженный файл никогда не должен открываться как страница.
        add_header Content-Disposition "inline" always;

        location ~ \.php$ { return 403; }
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
