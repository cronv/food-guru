server {
    listen 80;
    server_name _;
    root /var/www/api/public;
    index index.php;

    # Столько же, сколько в боевом конфиге: видеоработа на конкурс до 100 МБ.
    client_max_body_size 110m;
    client_body_timeout 300s;

    # Адреса API на Symfony (api/MIGRATION.md). Всё остальное — тот же index.php.
    include /etc/nginx/symfony-routes.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Загруженные файлы не исполняются: ^~ обязателен, иначе файл с расширением .php
    # из папки загрузок уедет в PHP-FPM.
    location ^~ /storage/ {
        alias /var/www/storage/public/;
        expires 30d;

        location ~ \.php$ { return 403; }
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
