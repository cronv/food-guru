server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Столько же, сколько в боевом конфиге: видеоработа на конкурс до 100 МБ.
    client_max_body_size 110m;
    client_body_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Загруженные файлы не исполняются. ^~ обязателен: без него регулярное
    # location ниже выигрывает у префиксного, и файл с расширением .php
    # из папки загрузок уедет в PHP-FPM.
    location ^~ /storage/ {
        expires 30d;

        location ~ \.php$ { return 403; }
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
