# Подключается только за Caddy (docker-compose.https.yml). Без этого и лимиты API,
# и журналы видели бы вместо посетителя адрес контейнера Caddy.
# Доверяем лишь внутренним сетям Docker: в этом режиме nginx снаружи недоступен,
# а Caddy подменяет присланный клиентом X-Forwarded-For своим.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
