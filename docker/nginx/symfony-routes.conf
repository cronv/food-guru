# Адреса API, перенесённые на Symfony (api/MIGRATION.md).
# Все адреса API теперь обслуживает Symfony; файл оставлен списком для проверки.
# Откат модуля — удалить его строки и выполнить `nginx -s reload`.
#
# Выражения точные. Всё, что не перечислено, обрабатывает тот же index.php Symfony
# через общее правило location /.

# Этап 1. Публичный каталог.
location ~ ^/api/v1/(home|categories|tags|collections|reels|recipes)$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/(categories|collections|recipes)/[^/]+$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/recipes/[^/]+/(related|view|reviews|reports)$ { include /etc/nginx/symfony-fastcgi.conf; }

# Этап 2. Журнал, академия, конкурсы, рейтинг, книги, магазин, клуб, карта сайта.
location ~ ^/api/v1/(contests|academy|journal|rating|books|club)$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/(contests|academy|journal|books|club)/[^/]+$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/journal/[^/]+/download$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/books/[^/]+/chapters/[0-9]+$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/shop/(products|delivery|orders)$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/shop/products/[^/]+$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/club-video/[0-9]+$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/seo/sitemap$ { include /etc/nginx/symfony-fastcgi.conf; }

# Этап 3. Действия вошедшего.
location ~ ^/api/v1/auth/ { include /etc/nginx/symfony-fastcgi.conf; }
location = /api/v1/me { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/me/password$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/recipes { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/contests { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/academy { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/journal { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/reports { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/media { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/users { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/books { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/club { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/(products|orders) { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/stats { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/admin/activity { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/me/(favorites|contest-entries|academy|rating)$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/me/cookbook/(recipes|notes)$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/me/cookbook/notes/[0-9]+$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/me/recipes(/media|/[0-9]+(/submit|/withdraw)?)?$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/recipes/[0-9]+/(favorite|cookbook|reaction)$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/reviews/[0-9]+$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/contests/[^/]+/entries(/[0-9]+/vote)?$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/academy/[^/]+/registration$ { include /etc/nginx/symfony-fastcgi.conf; }

# Этап 4. Деньги: кошелёк, платежи, покупка книг и PDF, заказы, подписка.
location ~ ^/api/v1/me/(wallet|wallet/topups|orders|subscription)$ { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/me/orders/[^/]+(/cancel)?$ { include /etc/nginx/symfony-fastcgi.conf; }
# Кавычки обязательны: без них nginx читает {36} как начало блока.
location ~ "^/api/v1/payments/(methods|[0-9a-f-]{36}(/test-complete)?)$" { include /etc/nginx/symfony-fastcgi.conf; }
location ~ ^/api/v1/books/[^/]+/(purchase|pdf)$ { include /etc/nginx/symfony-fastcgi.conf; }
