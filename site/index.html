function toast(msg) {
  document.getElementById("toast")?.remove();
  const t = document.createElement("div");
  t.id = "toast";
  t.setAttribute("role", "status");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function go(view, slug) {
  S.view = view;
  if (slug) {
    S.slug = slug;
    if (view === "recipe") {
      S.servings = bySlug(slug)?.serv || 4;
      S.shareOpen = false;
      S.gal = 0;
      S.draftShots = [];
      S.draftRating = 0;
      S.draftText = "";
    }
  }
  window.scrollTo({ top: 0, behavior: "instant" });

/* Избранное и сессия переживают перезагрузку. Хранилище может быть
   недоступно (приватное окно, запрет на данные сайта) — поэтому try/catch. */
const STORE = "food-guru-demo";

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      user: S.user, favorites: [...S.favorites],
      photos: S.photos, reviews: S.reviews
    }));
  } catch (e) {
    // Чаще всего это переполнение: фотографии занимают много места.
    // Данные остаются в памяти страницы, теряется только сохранение между визитами.
    toast("Снимков накопилось больше, чем помещается в браузер — в этой сессии всё на месте");
  }
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.user) S.user = data.user;
    if (Array.isArray(data.favorites)) S.favorites = new Set(data.favorites);
    if (data.photos && typeof data.photos === "object") S.photos = data.photos;
    if (data.reviews && typeof data.reviews === "object") S.reviews = data.reviews;
  } catch (e) { /* демо работает и без сохранения */ }
}

/* Снимок с телефона весит мегабайты. Ужимаем до 1100 px по длинной стороне:
   в галерее этого хватает, а в хранилище браузера помещается на порядок больше. */
function shrink(file, maxSide = 1100, quality = 0.72) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith("image/")) return reject(new Error("не изображение"));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("не удалось прочитать файл"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("не удалось открыть изображение"));
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        try {
          resolve(c.toDataURL("image/jpeg", quality));
        } catch (err) { reject(err); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function filesToShots(files, limit = 3) {
  const out = [];
  for (const f of [...files].slice(0, limit)) {
    try { out.push(await shrink(f)); }
    catch (e) { toast("Файл «" + f.name + "» не похож на изображение"); }
  }
  return out;
}

/* Параметрический конструктор иллюстраций: посуда + заливка + россыпь элементов.
   Один генератор на весь каталог — иллюстрации выходят разные, но одной руки. */
let _uid = 0;

function scatter(n, cx, cy, rx, ry, seed) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = i * 2.39996 + seed;
    const r = Math.sqrt((i + 0.6) / n) * 0.8;
    out.push([cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r, (a * 57) % 360]);
  }
  return out;
}

function dish(cfg) {
  const id = "g" + (++_uid);
  const vessel = cfg.vessel || "bowl";
  const base = cfg.base || "var(--broth)";
  const items = cfg.items || [];
  const label = cfg.label || "Иллюстрация блюда";

  // геометрия посуды: центр и радиусы области с едой
  const G = {
    bowl: { cx: 200, cy: 148, rx: 118, ry: 27, rim: [140, 34], bodyR: 140 },
    plate: { cx: 200, cy: 166, rx: 116, ry: 32, rim: [152, 44], bodyR: 0 },
    pan: { cx: 200, cy: 162, rx: 116, ry: 82, rim: [150, 110], bodyR: 0 }
  }[vessel];

  let body = "";
  if (vessel === "bowl") {
    body = `
      <path d="M60 148a140 140 0 0 0 280 0z" fill="url(#${id}v)"/>
      <ellipse cx="200" cy="148" rx="${G.rim[0]}" ry="${G.rim[1]}" fill="url(#${id}r)"/>
      <ellipse cx="200" cy="148" rx="${G.rx}" ry="${G.ry}" fill="url(#${id}b)"/>
      <ellipse cx="146" cy="214" rx="34" ry="46" fill="#fff" opacity=".1" filter="url(#${id}s)"/>`;
  } else if (vessel === "plate") {
    body = `
      <ellipse cx="200" cy="166" rx="${G.rim[0]}" ry="${G.rim[1]}" fill="url(#${id}r)"/>
      <ellipse cx="200" cy="166" rx="124" ry="36" fill="url(#${id}v)"/>
      <ellipse cx="200" cy="166" rx="${G.rx}" ry="${G.ry}" fill="url(#${id}b)"/>
      <ellipse cx="128" cy="160" rx="38" ry="10" fill="#fff" opacity=".2" filter="url(#${id}s)"/>`;
  } else {
    body = `
      <ellipse cx="200" cy="162" rx="150" ry="112" fill="url(#${id}v)"/>
      <ellipse cx="200" cy="164" rx="131" ry="96" fill="var(--sunken)"/>
      <ellipse cx="200" cy="164" rx="${G.rx}" ry="${G.ry}" fill="url(#${id}b)"/>
      <ellipse cx="146" cy="110" rx="48" ry="22" fill="#fff" opacity=".1" filter="url(#${id}s)"/>`;
  }

  let deco = "";
  items.forEach((it, k) => {
    const pts = scatter(it.n || 5, G.cx, G.cy, G.rx * (it.spread || 0.82),
      G.ry * (it.spread || 0.82), (k + 1) * 1.7);
    const s = it.size || 7;
    pts.forEach(([x, y, a], j) => {
      if (it.type === "leaf") {
        deco += `<g transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})">
          <ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${s * 1.7}" ry="${s * 0.8}" fill="${it.color}"/>
          <line x1="${(x - s * 1.4).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + s * 1.4).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#fff" stroke-opacity=".3" stroke-width="1"/></g>`;
      } else if (it.type === "chunk") {
        deco += `<g transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})">
          <rect x="${(x - s).toFixed(1)}" y="${(y - s * 0.7).toFixed(1)}" width="${s * 2}" height="${s * 1.4}" rx="3" fill="${it.color}"/>
          <rect x="${(x - s).toFixed(1)}" y="${(y - s * 0.7).toFixed(1)}" width="${s * 2}" height="${s * 0.5}" rx="3" fill="#fff" opacity=".22"/></g>`;
      } else if (it.type === "disc") {
        deco += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${s * 2}" ry="${s * 1.5}" fill="${it.color}"/>
          <ellipse cx="${(x - s * 0.5).toFixed(1)}" cy="${(y - s * 0.4).toFixed(1)}" rx="${s * 0.8}" ry="${s * 0.45}" fill="#fff" opacity=".3"/>`;
      } else if (it.type === "swirl") {
        deco += `<path d="M${(x - s * 2.4).toFixed(1)} ${y.toFixed(1)}q${s * 1.2} ${-s * 1.4} ${s * 2.4} 0t${s * 2.4} 0" fill="none" stroke="${it.color}" stroke-width="${Math.max(2, s * 0.6)}" stroke-linecap="round" opacity=".9"/>`;
      } else {
        deco += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s}" fill="${it.color}"/>
          <circle cx="${(x - s * 0.3).toFixed(1)}" cy="${(y - s * 0.3).toFixed(1)}" r="${s * 0.3}" fill="#fff" opacity=".35"/>`;
      }
      if (j > 60) return;
    });
  });

  return `<svg viewBox="0 0 400 300" role="img" aria-label="${label}">
    <defs>
      <linearGradient id="${id}v" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0" stop-color="var(--plate)"/><stop offset=".45" stop-color="var(--plate)"/><stop offset="1" stop-color="var(--choc-d)"/>
      </linearGradient>
      <linearGradient id="${id}r" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".4" stop-color="var(--plate)"/><stop offset="1" stop-color="var(--sunken)"/>
      </linearGradient>
      <radialGradient id="${id}b" cx=".36" cy=".3" r=".85">
        <stop offset="0" stop-color="${base}"/><stop offset="1" stop-color="var(--choc-d)"/>
      </radialGradient>
      <filter id="${id}s" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="${id}d" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    </defs>
    <ellipse cx="212" cy="${vessel === "bowl" ? 250 : 206}" rx="150" ry="${vessel === "pan" ? 100 : 30}" fill="#000" opacity=".42" filter="url(#${id}d)"/>
    ${body}
    ${deco}
  </svg>`;
}

/* Кадр «ингредиенты»: всё разложено на доске, элементов больше и шире. */
function variantIngredients(spec) {
  return dish({
    vessel: "plate", base: "var(--sunken)",
    label: "Ингредиенты, разложенные перед приготовлением",
    items: spec.items.map(it => ({ ...it, spread: 0.95, n: Math.min(9, (it.n || 4) + 3), size: (it.size || 6) * 0.9 }))
  });
}

/* Кадр «в процессе»: всё в сковороде, элементов меньше и ближе к центру. */
function variantProcess(spec) {
  return dish({
    vessel: "pan", base: spec.base,
    label: "Блюдо в процессе приготовления",
    items: spec.items.slice(0, 2).map(it => ({ ...it, spread: 0.6, n: Math.max(3, (it.n || 4) - 1) }))
  });
}

const ART_BY_SLUG = {
  "tykvennyy-krem-sup": "sup", "syrniki-risovaya-muka": "syrniki",
  "kinoa-svekla-feta": "kinoa", "shakshuka-s-fetoy": "shakshuka",
  "chechevichnyy-sup": "chechevica", "gribnoy-sup-slivki": "griby",
  "pasta-cacio-e-pepe": "cacio", "bedra-medovo-gorchichnye": "bedra"
};
RECIPES.forEach(r => { if (!r.art && ART_BY_SLUG[r.slug]) r.art = ART_BY_SLUG[r.slug]; });

/* Спецификация для вариантов: у рисованных вручную — своя. */
const SPEC_BY_SLUG = {
  ...ART_BY_SLUG,
  "shokoladnyy-fondan": "fondanSpec",
  "pasta-krevetki-tomat": "pastaSpec"
};

/* Галерея рецепта: кадр блюда, ингредиенты, процесс — плюс фото читателей. */
function galleryFor(r) {
  const spec = DISH_SPEC[SPEC_BY_SLUG[r.slug]];
  const base = [{ kind: "art", html: ART[r.art], cap: "Готовое блюдо" }];
  if (spec) {
    base.push({ kind: "art", html: variantIngredients(spec), cap: "Ингредиенты" });
    base.push({ kind: "art", html: variantProcess(spec), cap: "В процессе" });
  }
  const own = (S.photos[r.slug] || []).map(p => ({ kind: "photo", src: p.src, cap: p.cap || "Фото редакции" }));
  const readers = (S.reviews[r.slug] || []).flatMap(rv =>
    (rv.shots || []).map(src => ({ kind: "photo", src, cap: "Фото читателя · " + rv.name, reader: true })));
  return [...own, ...base, ...readers];
}

function pic(r, i, h, label) {
  if (r.art) return `<div class="artbox" style="height:${h}px">${ART[r.art]}</div>`;
  return ph(i, label, h);
}

function fmt(n) {
  const r = Math.round(n * 100) / 100;
  return (Math.abs(r - Math.round(r)) < 0.01 ? String(Math.round(r)) : String(r).replace(".", ",")).replace("-", "−");
}

function filtered() {
  const f = S.f;
  let list = PUBLISHED.filter(r => {
    if (f.q && !(r.title + " " + r.lead).toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.cats.size && !f.cats.has(r.cat)) return false;
    if (r.min > f.maxTime) return false;
    if (f.diff.size && !f.diff.has(r.diff)) return false;
    for (const d of f.diet) if (!r.diet.includes(d)) return false;
    return true;
  });
  if (f.sort === "fast") list = [...list].sort((a, b) => a.min - b.min);
  if (f.sort === "az") list = [...list].sort((a, b) => a.title.localeCompare(b.title, "ru"));
  return list;
}

/* Пустое состояние разное по причине: виноват запрос или слишком узкие фильтры.
   Если дело в фильтрах — показываем, что нашёл бы один запрос без них. */
function emptyState() {
  const f = S.f;
  const q = f.q.trim();
  const byQuery = q
    ? PUBLISHED.filter(r => (r.title + " " + r.lead + " " + r.tags.join(" ")).toLowerCase().includes(q.toLowerCase()))
    : [];
  const activeFilters = f.cats.size + f.diff.size + f.diet.size + (f.maxTime < 120 ? 1 : 0);

  const shell = (icon, title, text, actions, extra = "") => `
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:40px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px">
      <div style="width:60px;height:60px;border-radius:999px;background:var(--sunken);display:grid;place-items:center;color:var(--muted)">${icon}</div>
      <h3 style="font-family:var(--display);font-size:24px">${title}</h3>
      <p class="muted" style="margin:0;max-width:48ch;line-height:1.6">${text}</p>
      <div class="row" style="justify-content:center;margin-top:4px">${actions}</div>
      ${extra}
    </div>`;

  const lens = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>`;
  const funnel = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>`;

  // запрос что-то находит, но его отсекают фильтры
  if (q && byQuery.length && activeFilters) {
    return shell(funnel,
      "Фильтры отсекают всё найденное",
      `По запросу «${esc(q)}» ${plural(byQuery.length, "есть", "есть", "есть")} ${byQuery.length} ${plural(byQuery.length, "рецепт", "рецепта", "рецептов")}, но ${plural(activeFilters, "активный фильтр не пропускает его", "активные фильтры не пропускают их", "активные фильтры не пропускают их")}.`,
      `<button class="btn btn-green btn-sm" data-keepquery="1">Снять фильтры, оставить запрос</button>
       <button class="btn btn-ghost btn-sm" data-reset="1">Сбросить всё</button>`,
      `<div style="width:100%;margin-top:20px;text-align:left">
         <p class="muted" style="margin:0 0 12px;font-size:13px;letter-spacing:.08em;text-transform:uppercase">Нашлось бы без фильтров</p>
         <div class="grid">${byQuery.slice(0, 3).map((r, i) => cardHtml(r, i)).join("")}</div>
       </div>`);
  }

  // запрос не находит ничего
  if (q) {
    const suggestions = ["тыква", "паста", "шоколад", "суп"].filter(s => s !== q.toLowerCase());
    return shell(lens,
      `По запросу «${esc(q)}» ничего нет`,
      "Возможно, опечатка или такого рецепта пока не написали. Поиск ищет по названию, описанию и тегам.",
      `<button class="btn btn-ghost btn-sm" data-reset="1">Очистить поиск</button>`,
      `<div style="width:100%;margin-top:18px">
         <p class="muted" style="margin:0 0 10px;font-size:13px">Попробуйте:</p>
         <div class="row" style="justify-content:center">
           ${suggestions.map(s => `<button class="btn btn-ghost btn-sm" data-query="${esc(s)}">${esc(s)}</button>`).join("")}
         </div>
       </div>`);
  }

  // фильтров слишком много
  const hints = [];
  if (f.maxTime < 60) hints.push("увеличить время приготовления");
  if (f.diet.size) hints.push("снять ограничение по диете");
  if (f.cats.size > 1) hints.push("оставить одну категорию");
  if (f.diff.size === 1) hints.push("добавить вторую сложность");

  return shell(funnel,
    "Под такие условия ничего нет",
    hints.length
      ? `Сейчас стоит ${plural(activeFilters, "фильтр", "фильтра", "фильтров")}: ${activeFilters}. Помогло бы ${hints.slice(0, 2).join(" или ")}.`
      : "Попробуйте ослабить условия — например, увеличить время приготовления.",
    `<button class="btn btn-green btn-sm" data-reset="1">Сбросить фильтры</button>
     <button class="btn btn-ghost btn-sm" data-go="collections">Открыть подборки</button>`);
}

function frameHtml(item, cls = "") {
  return item.kind === "photo"
    ? `<img src="${item.src}" alt="${esc(item.cap)}" class="${cls}" loading="lazy">`
    : `<div class="artbox ${cls}">${item.html}</div>`;
}

function galleryHtml(r) {
  const items = galleryFor(r);
  const i = Math.min(S.gal, items.length - 1);
  const cur = items[i];
  const arrow = dir => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="${dir < 0 ? "m14.5 5-7 7 7 7" : "m9.5 5 7 7-7 7"}"/></svg>`;

  return `<div>
    <div class="gal-main">
      ${frameHtml(cur)}
      <button class="gal-nav" style="left:12px" data-gal="-1" aria-label="Предыдущий кадр">${arrow(-1)}</button>
      <button class="gal-nav" style="right:12px" data-gal="1" aria-label="Следующий кадр">${arrow(1)}</button>
      <button class="gal-count" data-box="${i}" aria-label="Открыть во весь экран">${i + 1} / ${items.length}</button>
      ${cur.reader ? `<span class="gal-badge">Фото читателя</span>` : ""}
    </div>
    <div class="gal-thumbs" role="tablist" aria-label="Кадры рецепта">
      ${items.map((it, k) => `<button role="tab" aria-current="${k === i}" data-galto="${k}" aria-label="${esc(it.cap)}">${frameHtml(it)}</button>`).join("")}
      <button data-addphoto="${r.slug}" style="flex:0 0 84px;height:64px;border:1.5px dashed var(--line);border-radius:10px;background:var(--sunken);color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center">+ фото</button>

    <p class="muted" style="margin:8px 0 0;font-size:13px">${esc(cur.cap)} · иллюстрации заменяются фотографиями по мере съёмки</p>
  </div>`;
}

function lightboxHtml() {
  if (!S.box) return "";
  const items = S.box.items;
  const i = S.box.i;
  const cur = items[i];
  return `<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр снимка">
    <div style="display:flex;align-items:center;gap:14px;max-width:100%">

function starsHtml(n, size = 16) {
  let out = `<span class="stars" role="img" aria-label="Оценка ${n} из 5">`;
  for (let i = 1; i <= 5; i++) {
    out += `<svg class="star" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"
      fill="${i <= n ? "var(--brick)" : "none"}" stroke="${i <= n ? "var(--brick)" : "var(--line)"}" stroke-width="1.6">
      <path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 17l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></svg>`;
  }
  return out + "</span>";
}

        ${tabs.map(([k, n]) => `<button class="btn btn-sm ${S.adminTab === k ? "btn-green" : "btn-ghost"}" data-tab="${k}">${n} · ${RECIPES.filter(r => r.status === k).length}</button>`).join("")}
      </div>

      <div class="scroll">
        <table>
          <thead><tr><th>Рецепт</th><th>Автор</th><th>Категория</th><th>Статус</th><th>Действия</th></tr></thead>
          <tbody>
            ${list.length ? list.map(r => {
              const [label, cls] = STATUS[r.status];
              return `<tr>
                <td style="font-weight:600">${esc(r.title)}</td>
                <td class="muted">Мария Левина</td>
                <td class="muted">${esc(r.cat)}</td>
                <td><span class="chip ${cls}">${label}</span></td>
                <td><div class="row">
                  <button class="btn btn-ghost btn-sm" data-act="edit">Открыть</button>
                  ${r.status === "moderation"
                    ? `<button class="btn btn-sm ${canPublish ? "btn-green" : "btn-ghost"}" data-act="publish">Опубликовать</button>
                       <button class="btn btn-ghost btn-sm" data-act="reject">Вернуть</button>`
                    : ""}
                </div></td>
              </tr>`;
            }).join("") : `<tr><td colspan="5" class="muted" style="padding:28px;text-align:center">В этом статусе пусто</td></tr>`}
          </tbody>
        </table>
      </div>

      <div class="note" style="margin-top:18px">
        Сейчас вы — <strong>${ROLES[role]}</strong>.
        ${role === "content_manager"
          ? "Можно создавать и править свои рецепты. Публикация и возврат на доработку недоступны — нажмите «Опубликовать», чтобы увидеть ответ сервера."
          : role === "editor_lead"
            ? "Можно публиковать, возвращать на доработку и править чужие рецепты. Роли меняются только контент-менеджерам, настройки системы закрыты."
            : "Доступно всё, включая настройки системы и журнал действий."}
      </div>
    </section>
  </div>`;
}

      ${list.length ? `<p style="margin:16px 0 0;font-size:14px;opacity:.85">${list.length} ${plural(list.length, "рецепт", "рецепта", "рецептов")}${quick ? ` · ${quick} за полчаса и быстрее` : ""}</p>` : ""}

           <div style="width:60px;height:60px;border-radius:999px;background:var(--sunken);display:grid;place-items:center;color:var(--muted)">
             <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 13h18a9 9 0 0 1-18 0Z"/><path d="M12 3.5v3.2"/><path d="M8.4 6.7h7.2"/></svg>

           <h2 style="font-size:24px">Раздел пока готовится</h2>
           <p class="muted" style="margin:0;max-width:46ch">Рецепты этой категории ещё на модерации. Как только редакция их опубликует, они появятся здесь.</p>

    <div style="margin-top:40px;padding-top:26px;border-top:1px solid var(--line)">
      <h2 style="font-size:22px;margin-bottom:14px">Другие категории</h2>
      <div class="row">
        ${others.map(x => `<button class="btn btn-ghost btn-sm" data-category="${x.slug}">${esc(x.title)}</button>`).join("")}
      </div>
    </div>
  </div>`;
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

/* ---------- отрисовка ---------- */
function renderChrome() {
  const items = [["home", "Главная"], ["catalog", "Рецепты"], ["collections", "Подборки"],
                 ["journal", "Журнал"], ["admin", "Админка"]];
  const active = k => S.view === k || (k === "catalog" && S.view === "category")
    || (k === "collections" && S.view === "collection")
    || (k === "journal" && S.view === "article");

  document.getElementById("nav").innerHTML = items
    .map(([k, n]) => `<button data-go="${k}" aria-current="${active(k)}">${n}</button>`).join("");

  document.getElementById("topActions").innerHTML = `
    <input type="search" id="topSearch" placeholder="Найти рецепт" aria-label="Поиск по рецептам"
           style="width:190px;min-height:40px;border-radius:999px;font-size:14px">
    ${S.user
      ? `<button class="btn btn-ghost btn-sm" data-go="account">${esc(S.user.name)} · ${S.favorites.size} ★</button>`
      : `<button class="btn btn-green btn-sm" data-go="auth">Войти</button>`}`;

  // та же навигация плюс категории — для выдвижной панели на телефоне
  document.getElementById("drawerIn").innerHTML =
    items.map(([k, n]) => `<button data-go="${k}" aria-current="${active(k)}">${n}</button>`).join("")
    + `<div style="margin:10px 0 4px;padding:0 14px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Категории</div>`
    + CATS.map(c => `<button data-cat="${esc(c)}" style="font-weight:500;color:var(--muted)">${esc(c)}</button>`).join("")
    + (S.user ? `<button data-go="account">Избранное · ${S.favorites.size}</button>`
              : `<button data-go="auth" style="color:var(--green)">Войти</button>`);
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("burger").setAttribute("aria-expanded", "false");
}

function render() {
  renderChrome();
  const views = {
    home: viewHome, catalog: viewCatalog, recipe: viewRecipe, auth: viewAuth,
    inbox: viewInbox, account: viewAccount, admin: viewAdmin,
    collections: viewCollections, collection: viewCollection,
    journal: viewJournal, article: viewArticle, category: viewCategory
  };
  app.innerHTML = (views[S.view] || viewHome)();

  let box = document.getElementById("boxHost");
  if (!box) {
    box = document.createElement("div");
    box.id = "boxHost";
    document.body.appendChild(box);
  }
  box.innerHTML = lightboxHtml();
}

function openBox(items, i) {
  S.box = { items, i: Math.max(0, Math.min(i, items.length - 1)) };
  render();
}

/* ---------- события ---------- */
document.addEventListener("click", e => {
  if (e.target.closest("#burger")) {
    const dr = document.getElementById("drawer");
    const open = dr.classList.toggle("open");
    document.getElementById("burger").setAttribute("aria-expanded", String(open));
    return;
  }

  const t = e.target.closest("[data-go],[data-recipe],[data-collection],[data-article],[data-category],[data-query],[data-keepquery],[data-fav],[data-share],[data-copy],[data-serv],[data-cat],[data-reset],[data-verify],[data-resend],[data-tab],[data-act],[data-logout],[data-admin-users],[data-gal],[data-galto],[data-box],[data-boxnav],[data-boxclose],[data-revshot],[data-addphoto],[data-rate],[data-dropshot]");
  if (!t) return;

  /* --- галерея и просмотр --- */
  if (t.dataset.gal) {
    const items = galleryFor(bySlug(S.slug));
    S.gal = (S.gal + Number(t.dataset.gal) + items.length) % items.length;
    return render();
  }
  if (t.dataset.galto) { S.gal = Number(t.dataset.galto); return render(); }
  if (t.dataset.box) return openBox(galleryFor(bySlug(S.slug)), Number(t.dataset.box));
  if (t.dataset.boxnav) {
    const n = S.box.items.length;
    S.box.i = (S.box.i + Number(t.dataset.boxnav) + n) % n;
    return render();
  }
  if (t.dataset.boxclose) { S.box = null; return render(); }
  if (t.dataset.revshot) {
    const [slug, ri, si] = t.dataset.revshot.split("|");
    const rv = (S.reviews[slug] || [])[Number(ri)];
    if (!rv) return;
    const items = rv.shots.map(src => ({ kind: "photo", src, cap: "Фото читателя · " + rv.name, reader: true }));
    return openBox(items, Number(si));
  }
  if (t.dataset.addphoto) {
    const slug = t.dataset.addphoto;
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
    inp.onchange = async () => {
      const shots = await filesToShots(inp.files, 6);
      if (!shots.length) return;
      S.photos[slug] = [...(S.photos[slug] || []), ...shots.map(src => ({ src, cap: "Фото редакции" }))];
      S.gal = 0;
      save();
      toast(shots.length === 1 ? "Снимок добавлен в галерею" : shots.length + " снимка добавлены в галерею");
      render();
    };
    inp.click();
    return;
  }

  /* --- форма отзыва --- */
  if (t.dataset.rate) { S.draftRating = Number(t.dataset.rate); return render(); }
  if (t.dataset.dropshot) { S.draftShots.splice(Number(t.dataset.dropshot), 1); return render(); }

  closeDrawer();

  if (t.dataset.go) { e.preventDefault(); if (t.dataset.go === "auth" && S.user) return go("account"); return go(t.dataset.go); }
  if (t.dataset.recipe) return go("recipe", t.dataset.recipe);
  if (t.dataset.collection) return go("collection", t.dataset.collection);
  if (t.dataset.article) return go("article", t.dataset.article);
  if (t.dataset.category) return go("category", t.dataset.category);

  if (t.dataset.cat) {
    const c = catByTitle(t.dataset.cat);
    return c ? go("category", c.slug) : go("catalog");
  }
  if (t.dataset.query) { S.f.q = t.dataset.query; return go("catalog"); }
  if (t.dataset.keepquery) {
    S.f = { q: S.f.q, cats: new Set(), maxTime: 120, diff: new Set(), diet: new Set(), sort: S.f.sort };
    return render();
  }
  if (t.dataset.reset) { S.f = { q: "", cats: new Set(), maxTime: 120, diff: new Set(), diet: new Set(), sort: "pop" }; return render(); }

  if (t.dataset.fav) {
    if (!S.user) { toast("Сначала подтвердите email — избранное только для активных аккаунтов"); return go("auth"); }
    S.favorites.has(t.dataset.fav) ? S.favorites.delete(t.dataset.fav) : S.favorites.add(t.dataset.fav);
    toast(S.favorites.has(t.dataset.fav) ? "Сохранено в избранное" : "Убрано из избранного");
    save();
    return render();
  }

  if (t.dataset.share) { S.shareOpen = !S.shareOpen; return render(); }

  if (t.dataset.copy) {
    const text = t.dataset.copy;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(() => toast("Ссылка скопирована")).catch(() => {
        document.getElementById("shareLink")?.select();
        toast("Скопируйте ссылку вручную — выделено");
      });
    } else {
      document.getElementById("shareLink")?.select();
      toast("Скопируйте ссылку вручную — выделено");
    }
    return;
  }

  if (t.dataset.serv) {
    S.servings = Math.min(12, Math.max(1, S.servings + Number(t.dataset.serv)));
    return render();
  }

  if (t.dataset.verify) {
    if (S.letter.used) { S.authStage = "expired"; return go("auth"); }
    S.letter.used = true;
    S.user = { name: S.letter.name, email: S.letter.email };
    S.authStage = "done";
    save();
    return go("auth");
  }

  if (t.dataset.resend) {
    S.letter = { ...S.letter, token: Math.random().toString(36).slice(2, 14), used: false };
    S.authStage = "sent";
    toast("Новый токен выпущен, старый погашен");
    return go("auth");
  }

  if (t.dataset.logout) { S.user = null; S.favorites.clear(); S.authStage = "form"; S.letter = null; save(); toast("Сессия закрыта"); return go("home"); }

  if (t.dataset.tab) { S.adminTab = t.dataset.tab; return render(); }

  if (t.dataset.adminUsers) { toast(S.adminRole === "content_manager" ? "403 — недостаточно прав" : "Раздел появится на этапе 5"); return; }

  if (t.dataset.act) {
    const a = t.dataset.act;
    if (a === "edit") return toast("Редактор рецепта — этап 4");
    if (S.adminRole === "content_manager") return toast("403 — публикует только руководитель редакции");
    return toast(a === "publish" ? "Рецепт опубликован, запись ушла в журнал действий" : "Возвращён на доработку с комментарием");
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "revText") { S.draftText = e.target.value; return; }
  const f = e.target.dataset.filter;
  if (!f) return;
  if (f === "q") { S.f.q = e.target.value; const p = e.target.selectionStart; render(); const el = document.getElementById("fq"); if (el) { el.focus(); el.setSelectionRange(p, p); } return; }
  if (f === "time") { S.f.maxTime = Number(e.target.value); return render(); }
  if (f === "sort") { S.f.sort = e.target.value; return render(); }
  const set = f === "cat" ? S.f.cats : f === "diff" ? S.f.diff : S.f.diet;
  e.target.checked ? set.add(e.target.value) : set.delete(e.target.value);
  render();
});

document.addEventListener("change", async e => {
  if (e.target.dataset.role) { S.adminRole = e.target.value; render(); return; }
  if (e.target.id === "revFiles") {
    const shots = await filesToShots(e.target.files, 3 - S.draftShots.length);
    S.draftShots = [...S.draftShots, ...shots].slice(0, 3);
    render();
  }
});

/* перетаскивание файлов в форму отзыва */
document.addEventListener("dragover", e => {
  const d = e.target.closest("#revDrop");
  if (!d) return;
  e.preventDefault();
  d.classList.add("over");
});
document.addEventListener("dragleave", e => {
  e.target.closest("#revDrop")?.classList.remove("over");
});
document.addEventListener("drop", async e => {
  const d = e.target.closest("#revDrop");
  if (!d) return;
  e.preventDefault();
  d.classList.remove("over");
  const shots = await filesToShots(e.dataTransfer.files, 3 - S.draftShots.length);
  S.draftShots = [...S.draftShots, ...shots].slice(0, 3);
  render();
});

document.addEventListener("submit", e => {
  if (e.target.id === "revForm") {
    e.preventDefault();
    const slug = e.target.dataset.slug;
    const text = (document.getElementById("revText")?.value || S.draftText).trim();
    if (!S.draftRating) return toast("Поставьте оценку от 1 до 5");
    if (text.length < 10) return toast("Напишите пару предложений — так отзыв полезнее");

    const date = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    S.reviews[slug] = [{
      name: S.user.name, rating: S.draftRating, text, shots: S.draftShots, date
    }, ...(S.reviews[slug] || [])];

    S.draftShots = []; S.draftRating = 0; S.draftText = "";
    save();
    toast(S.reviews[slug][0].shots.length ? "Отзыв опубликован, фото ушло в галерею" : "Отзыв опубликован");
    return render();
  }

  if (e.target.id !== "regForm") return;
  e.preventDefault();
  const name = document.getElementById("rn").value.trim();
  const email = document.getElementById("re").value.trim().toLowerCase();
  if (!document.getElementById("rt").checked) return toast("Нужно согласие на обработку данных");
  S.draftName = name; S.draftEmail = email;
  S.letter = { name, email, token: Math.random().toString(36).slice(2, 14), used: false };
  S.authStage = "sent";
  go("auth");
});

document.addEventListener("keydown", e => {
  if (e.target.id === "topSearch" && e.key === "Enter") {
    e.preventDefault();
    S.f.q = e.target.value.trim();
    go("catalog");
    return;
  }
  if (e.key === "Escape") { closeDrawer(); if (S.box) { S.box = null; render(); } return; }
  if (S.box && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const n = S.box.items.length;
    S.box.i = (S.box.i + (e.key === "ArrowLeft" ? -1 : 1) + n) % n;
    return render();
  }
  if (S.view === "recipe" && !S.box && (e.key === "ArrowLeft" || e.key === "ArrowRight")
      && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
    const items = galleryFor(bySlug(S.slug));
    S.gal = (S.gal + (e.key === "ArrowLeft" ? -1 : 1) + items.length) % items.length;
    render();
  }
});

load();
// демо-отзывы подставляются только там, где читатели ещё ничего не написали
Object.entries(SEED_REVIEWS).forEach(([slug, list]) => {
  if (!S.reviews[slug] || !S.reviews[slug].length) S.reviews[slug] = list.map(x => ({ ...x }));
});
render();
})();
</script>
