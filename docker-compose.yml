services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  # Обработчик очереди: письма подтверждения уходят отсюда.
  # Перезапуск нужен при первом запуске: контейнер стартует раньше миграций,
  # падает без таблицы jobs и без него так и остаётся лежать.
  queue:
    build:
      context: ./docker/php
    command: php artisan queue:work --tries=3 --timeout=60
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: food_guru
      MYSQL_USER: food_guru
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      # Только с этого компьютера: иначе база с паролем secret открыта всей локальной сети.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Все письма оседают здесь, наружу ничего не уходит: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
