services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/symfony-routes.conf:/etc/nginx/symfony-routes.conf:ro
      - ./docker/nginx/symfony-fastcgi.conf:/etc/nginx/symfony-fastcgi.conf:ro
      - ./storage:/var/www/storage:ro
    depends_on:
      - api

  # API на Symfony: php-fpm, код в ./api, загруженные файлы в ./storage.
  api:
    build:
      context: ./docker/php
    working_dir: /var/www/api
    volumes:
      - ./docker/php/zzz-listen.conf:/usr/local/etc/php-fpm.d/zzz-listen.conf:ro
      - ./api:/var/www/api
      - ./storage:/var/www/storage
      # Демо-данные для food-guru:seed-demo: только чтение.
      - ./seed-assets:/var/www/seed-assets:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: food_guru
      MYSQL_USER: food_guru
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      # Только с этого компьютера: иначе база с паролем secret открыта всей локальной сети.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Все письма оседают здесь, наружу ничего не уходит: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
